# Configuración para las pruebas: tiene prioridad sobre src/main/resources/application.properties.
# Usa una base de datos aparte (plisw3_test) para no tocar la de desarrollo; el esquema se crea
# al iniciar las pruebas y se elimina al terminar. Cada prueba carga pli.sql y hace rollback.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/plisw3_test?serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
# Sin valores por defecto: vienen de variables de entorno o de application-secret.properties
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Credenciales locales: application-secret.properties en la raíz del proyecto (ver la plantilla
# application-secret.properties.example). Se busca desde web/ o negocio/ (../) y desde la raíz (./).
spring.config.import=optional:file:../application-secret.properties,optional:file:./application-secret.properties,optional:classpath:application-secret.properties
