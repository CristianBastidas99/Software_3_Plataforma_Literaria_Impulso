<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <!-- El token va en la URL: que no se envíe a otros sitios en la cabecera Referer -->
        <meta name="referrer" content="no-referrer"/>
    </ui:define>
    <ui:define name="title">Nueva contraseña</ui:define>

    <ui:define name="content">
        <div class="py-md-4">
            <p:panel header="Elige una contraseña nueva" styleClass="contenido-estrecho mb-4">
                <h:form id="formRestablecer">
                    <ui:fragment rendered="#{restablecerBean.tokenValido}">
                        <p>Cuenta: <strong>#{restablecerBean.email}</strong></p>
                        <div class="form-group">
                            <p:outputLabel for="password" value="Contraseña nueva"/>
                            <p:password id="password" value="#{restablecerBean.password}" styleClass="form-control"
                                        placeholder="Entre 8 y 30 caracteres" maxlength="30" toggleMask="true"/>
                        </div>
                        <div class="form-group">
                            <p:outputLabel for="confirmPassword" value="Confirmar contraseña"/>
                            <p:password id="confirmPassword" value="#{restablecerBean.confirmPassword}" styleClass="form-control"
                                        maxlength="30" toggleMask="true"/>
                        </div>
                        <div class="form-group p-2">
                            <p:commandButton id="cambiar" value="Cambiar contraseña" action="#{restablecerBean.cambiar}"
                                             update="@form" styleClass="btn btn-primary"/>
                        </div>
                    </ui:fragment>

                    <p:messages id="mensajes" showDetail="true"/>

                    <ui:fragment rendered="#{not restablecerBean.tokenValido}">
                        <div id="enlaceInvalido" class="alert alert-warning">#{restablecerBean.motivoInvalido}</div>
                        <h:link outcome="recuperar.xhtml" value="Pedir un enlace nuevo" styleClass="btn btn-primary"/>
                    </ui:fragment>
                </h:form>
            </p:panel>
        </div>
    </ui:define>


</ui:composition>
</html>
