<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition template="/WEB-INF/template.xhtml">


    <ui:define name="title">#{escritorBean.encontrado ? escritorBean.escritor.nombre : 'Escritor no encontrado'}</ui:define>

    <ui:define name="content">
        <ui:fragment rendered="#{not escritorBean.encontrado}">
            <div class="card p-5 text-center contenido-centrado">
                <h2>Escritor no encontrado</h2>
                <p>El escritor que buscas no existe o ya no está disponible.</p>
                <div>
                    <p:button value="Explorar escritores" outcome="explorar.xhtml" styleClass="ui-button-raised">
                    </p:button>
                </div>
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{escritorBean.encontrado}">
        <div class="row">
            <div class="col-md-4">
                <!-- Información del Escritor -->
                <p:panel header="Información del Escritor">
                    <h:graphicImage value="#{recursos.imagenUsuario(escritorBean.escritor.urlImagen)}" alt="Avatar del Escritor" styleClass="card-img-top"/>
                    <h:panelGrid columns="1" styleClass="card-body">
                        <h:outputText value="#{escritorBean.escritor.nombre}" styleClass="card-title"/>
                        <h:outputText value="#{escritorBean.escritor.biografia}" styleClass="card-text"/>
                    </h:panelGrid>
                    <h:form id="formFavorito" styleClass="px-3 pb-3">
                        <div class="mb-2 text-muted">
                            <i class="pi pi-users"></i>
                            <h:outputText id="seguidores" value=" #{escritorBean.seguidores} #{escritorBean.seguidores == 1 ? 'seguidor' : 'seguidores'}"/>
                        </div>
                        <p:commandButton id="seguir" rendered="#{escritorBean.lector}"
                                         value="#{escritorBean.favorito ? 'Siguiendo' : 'Seguir'}"
                                         icon="#{escritorBean.favorito ? 'pi pi-heart-fill' : 'pi pi-heart'}"
                                         action="#{escritorBean.alternarFavorito}" process="@this" update="@form"
                                         styleClass="#{escritorBean.favorito ? 'ui-button-danger' : 'ui-button-outlined'}"/>
                        <p:growl id="mensajesFavorito" life="2500"/>
                    </h:form>
                </p:panel>
            </div>
            <div class="col-md-8 p-5">
                <p:carousel value="#{escritorBean.publicacionList}" rendered="#{not empty escritorBean.publicacionList}" var="publicacion" circular="true" autoplayInterval="3000"
                            responsiveOptions="#{escritorBean.responsiveOptions}" numVisible="3" numScroll="1">
                    <f:facet name="header">
                        <h2>Publicaciones Populares</h2>
                    </f:facet>

                    <div class="product-item p-2">
                        <div class="product-item-content">
                            <div class="mb-3">
                                <p:graphicImage value="#{recursos.imagenPublicacion(publicacion.urlImagen)}" styleClass="product-image card-img-top"/>
                            </div>
                            <div>
                                <h4 class="mb-1">#{publicacion.titulo}</h4>
                                <h6 class="mt-0 mb-3">
                                    <h:outputText value="#{publicacion.contenido}" />
                                </h6>
                                <p:button value="Ver Detalles" outcome="publicacion.xhtml" styleClass="ui-button-raised">
                                    <f:param name="idProd" value="#{publicacion.id}" />
                                </p:button>
                            </div>
                        </div>
                    </div>
                </p:carousel>
                <h:outputText value="Este escritor aún no tiene publicaciones." styleClass="text-muted"
                              rendered="#{empty escritorBean.publicacionList}"/>
            </div>
        </div>
        </ui:fragment>
    </ui:define>


</ui:composition>
</html>
