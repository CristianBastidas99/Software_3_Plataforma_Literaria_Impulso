<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="head">
        <h:outputStylesheet library="css" name="bootstrap.min.css" />
        <h:outputStylesheet library="css" name="style.css" />
    </ui:define>
    <ui:define name="title">Búsqueda y exploración</ui:define>
    <ui:define name="content">
        <!-- Contenido principal -->
        <div class="card ml-auto p-5">
            <!-- Búsqueda de Fragmentos Literarios -->
            <h:form id="searchForm">
                <div class="d-flex flex-wrap align-items-center">
                    <p:selectOneMenu id="searchType" value="#{explorarBean.searchType}" appendTo="@(self)" styleClass="mr-2 mb-2">
                        <f:selectItem itemLabel="Buscar publicaciones" itemValue="0" />
                        <f:selectItem itemLabel="Buscar escritores" itemValue="1" />
                        <p:ajax listener="#{explorarBean.cambiarTipo}" process="@this" update="@form resultados"/>
                    </p:selectOneMenu>
                    <p:inputText id="searchInput" value="#{explorarBean.searchInput}" styleClass="mr-2 mb-2 flex-grow-1"
                                 placeholder="#{explorarBean.buscandoPublicaciones ? 'Título o descripción (opcional)' : 'Nombre o biografía'}"/>
                    <ui:fragment rendered="#{explorarBean.buscandoPublicaciones}">
                        <p:selectOneMenu id="genero" value="#{explorarBean.idGenero}" appendTo="@(self)" styleClass="mr-2 mb-2">
                            <f:selectItem itemLabel="Todos los géneros" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{explorarBean.generos}" var="g" itemValue="#{g.id}" itemLabel="#{g.nombre}"/>
                        </p:selectOneMenu>
                        <p:selectOneMenu id="orden" value="#{explorarBean.orden}" appendTo="@(self)" styleClass="mr-2 mb-2">
                            <f:selectItem itemLabel="Más recientes" itemValue="RECIENTES"/>
                            <f:selectItem itemLabel="Más populares" itemValue="POPULARES"/>
                        </p:selectOneMenu>
                    </ui:fragment>
                    <p:commandButton id="buscar" value="Buscar" icon="pi pi-search" action="#{explorarBean.realizarBusqueda}"
                                     update="resultados" styleClass="mb-2"/>
                </div>
            </h:form>
        </div>
        <!-- Resultados de la búsqueda de Fragmentos Literarios -->
        <div class="card ml-auto p-5">
            <h3>Resultados</h3>
            <div class="card product">
                <h:form id="resultados">
                    <p class="text-muted mb-2" id="totalResultados">#{explorarBean.resultadosBusqueda.size()} #{explorarBean.resultadosBusqueda.size() == 1 ? 'resultado' : 'resultados'}</p>
                    <p:dataView var="resultado" value="#{explorarBean.resultadosBusqueda}" rows="12" paginator="true"
                                rowsPerPageTemplate="6,12,16"
                                paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                gridIcon="pi pi-th-large" listIcon="pi pi-bars">

                        <p:dataViewListItem rendered="#{explorarBean.searchType eq '0'}">
                            <div class="container-flex product-list-item p-4">
                                <p:graphicImage value="#{recursos.imagenPublicacion(resultado.urlImagen)}" style="width: 20%;"/>
                                <div class="product-list-detail p-2" style="width: 73%;">
                                    <div class="product-name">#{resultado.titulo}</div>
                                    <div class="product-description">#{resultado.contenido}</div>
                                </div>
                                <div class="product-list-action" style="display: flex; align-items: center; justify-content: center;width: 7%;">
                                    <p:button type="button"
                                              value="Ver Detalles"
                                              outcome="publicacion.xhtml">
                                        <f:param name="idProd" value="#{resultado.id}" />
                                    </p:button>
                                </div>
                            </div>
                        </p:dataViewListItem>
                        <p:dataViewListItem rendered="#{explorarBean.searchType eq '1'}">
                            <div class="container-flex product-list-item p-4" >
                                <p:graphicImage value="#{recursos.imagenUsuario(resultado.urlImagen)}" style="width: 20%;"/>
                                <div class="product-list-detail p-2" style="width: 73%;">
                                    <div class="product-name">#{resultado.nombre}</div>
                                    <div class="product-description">#{resultado.biografia}</div>
                                </div>
                                <div class="product-list-action" style="display: flex; align-items: center; justify-content: center;width: 7%;">
                                    <p:button type="button"
                                              value="Ver Detalles"
                                              outcome="escritor.xhtml">
                                        <f:param name="idEscr" value="#{resultado.id}" />
                                    </p:button>
                                </div>
                            </div>
                        </p:dataViewListItem>
                    </p:dataView>
                    <p:messages showDetail="true" />
                </h:form>
            </div>
        </div>

    </ui:define>
    <ui:define name="script">
        <h:outputScript library="js" name="bootstrap.bundle.min.js" />
    </ui:define>
</ui:composition>
</html>
