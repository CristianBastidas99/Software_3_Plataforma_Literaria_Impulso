<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition template="/WEB-INF/template.xhtml">

    <ui:define name="title">Editar perfil</ui:define>

    <ui:define name="content">

        <ui:fragment rendered="#{not editarPerfilBean.puedeEditar}">
            <div class="card p-5 text-center contenido-centrado">
                <h2>Inicia sesión para editar tu perfil</h2>
                <p>Esta página es para escritores y lectores con sesión iniciada.</p>
                <div>
                    <p:button value="Iniciar sesión" outcome="login.xhtml" styleClass="ui-button-raised"/>
                </div>
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{editarPerfilBean.puedeEditar}">
        <div class="card p-5">
            <p:panel id="edit" header="Editar perfil de #{editarPerfilBean.titulo}" styleClass="contenido-centrado mb-4">
                <h:form id="editProfileForm" enctype="multipart/form-data">
                    <div class="form-group p-2">
                        <p:outputLabel for="nombre" value="Nombre" />
                        <p:inputText id="nombre" value="#{editarPerfilBean.nombre}" styleClass="form-control"
                                     maxlength="30" placeholder="Tu nombre" />
                    </div>
                    <div class="form-group p-2">
                        <p:outputLabel for="email" value="Correo electrónico" />
                        <p:inputText id="email" type="email" value="#{editarPerfilBean.email}" styleClass="form-control"
                                     maxlength="50" placeholder="tu@correo.com" />
                    </div>
                    <ui:fragment rendered="#{editarPerfilBean.escritor}">
                        <div class="form-group p-2">
                            <p:outputLabel for="biografia" value="Biografía" />
                            <p:inputTextarea id="biografia" value="#{editarPerfilBean.biografia}" rows="5" styleClass="form-control"
                                             maxlength="250" counter="contadorBiografia"
                                             counterTemplate="Quedan {0} caracteres" autoResize="false"
                                             placeholder="Escribe una breve biografía" />
                            <h:outputText id="contadorBiografia" styleClass="text-muted small"/>
                        </div>
                    </ui:fragment>
                    <div class="form-group p-2">
                        <p:outputLabel for="imagen_perfil" value="Imagen de perfil" />
                        <h:panelGroup id="vistaPrevia" layout="block" styleClass="mb-2 d-flex align-items-center">
                            <p:graphicImage id="imagenActual" value="#{recursos.imagenUsuario(editarPerfilBean.imagenVistaPrevia)}"
                                            alt="Imagen de perfil" style="width: 120px; height: 120px; object-fit: cover; border-radius: 50%;"/>
                            <div class="ml-3">
                                <h:outputText value="Vista previa: sin guardar" styleClass="badge badge-warning"
                                              rendered="#{editarPerfilBean.hayImagenPendiente}"/>
                                <div class="mt-2">
                                    <p:commandButton value="Usar imagen por defecto" icon="pi pi-times" process="@this"
                                                     action="#{editarPerfilBean.quitarImagen}"
                                                     update="vistaPrevia mensajesPerfil"
                                                     styleClass="ui-button-secondary ui-button-flat"/>
                                </div>
                            </div>
                        </h:panelGroup>
                        <p:fileUpload id="imagen_perfil" listener="#{editarPerfilBean.subirImagen}" mode="advanced" dragDropSupport="false"
                                      auto="true" label="Elegir imagen"
                                      sizeLimit="#{recursos.maxImagenBytes}" allowTypes="/(\.|\/)(jpe?g|png|webp|JPE?G|PNG|WEBP)$/"
                                      accept=".jpg,.jpeg,.png,.webp"
                                      invalidFileMessage="Formato no permitido. La imagen debe ser JPG, PNG o WEBP."
                                      invalidSizeMessage="La imagen supera el tamaño máximo permitido."
                                      update="vistaPrevia mensajesPerfil"/>
                        <small class="text-muted">JPG, PNG o WEBP. Máximo #{recursos.maxImagenMb} MB.</small>
                    </div>
                    <div class="form-group p-2">
                        <p:commandButton id="guardar" value="Guardar cambios" action="#{editarPerfilBean.guardarCambios}" styleClass="btn btn-primary"
                                         process="@form" update="@form :menuUsuario" />
                    </div>
                    <p:messages id="mensajesPerfil" showDetail="true" />
                </h:form>
            </p:panel>
        </div>

        <div class="card p-5">
            <p:panel header="Cambiar contraseña" styleClass="contenido-centrado mb-4">
                <h:form id="editPassForm">
                    <div class="form-group p-2">
                        <p:outputLabel for="contrasenaActual" value="Contraseña actual" />
                        <p:password id="contrasenaActual" value="#{editarPerfilBean.contrasenaActual}" styleClass="form-control"
                                    toggleMask="true" placeholder="Tu contraseña actual" />
                    </div>
                    <div class="form-group p-2">
                        <p:outputLabel for="nuevaContrasena" value="Nueva contraseña" />
                        <p:password id="nuevaContrasena" value="#{editarPerfilBean.nuevaContrasena}" styleClass="form-control"
                                    toggleMask="true" maxlength="30" placeholder="Al menos 8 caracteres" />
                    </div>
                    <div class="form-group p-2">
                        <p:outputLabel for="confirmarContrasena" value="Confirmar nueva contraseña" />
                        <p:password id="confirmarContrasena" value="#{editarPerfilBean.confirmarContrasena}" styleClass="form-control"
                                    toggleMask="true" maxlength="30" placeholder="Repite la nueva contraseña" />
                    </div>
                    <div class="form-group p-2">
                        <p:commandButton id="cambiar" value="Cambiar contraseña" action="#{editarPerfilBean.cambiarContrasena}" styleClass="btn btn-primary"
                                         update="@form" />
                    </div>
                    <p:messages id="mensajesContrasena" showDetail="true" />
                </h:form>
            </p:panel>
        </div>
        </ui:fragment>
    </ui:define>


</ui:composition>
</html>
