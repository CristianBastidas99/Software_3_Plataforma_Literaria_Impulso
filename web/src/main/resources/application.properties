# ===== Base de datos: contenedor Docker 'unimotor-mysql' (MySQL 8, puerto 3306) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/plisw3?serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ===== Correo: contenedor Docker 'unimotor-mailpit' (SMTP 1025, bandeja web en http://localhost:8025) =====
# Mailpit no usa autenticacion ni TLS.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Opcional: credenciales/overrides locales que no se suben al repo
spring.config.import=optional:classpath:application-secret.properties

# ===== Subida de archivos =====
# Carpeta externa donde se guardan las imágenes y PDFs que suben los usuarios (se crea al arrancar).
# Ruta relativa al directorio desde el que se arranca la app (con ./gradlew :web:bootRun es web/uploads).
upload.dir=${UPLOAD_DIR:uploads}
upload.imagen.max-mb=5
upload.pdf.max-mb=20
# Límites del servidor: un poco por encima de los de la app, para que el exceso lo rechace
# ArchivoServicio con un mensaje claro y no el contenedor con un error genérico.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

#joinfaces.primefaces.theme=name
joinfaces.primefaces.move-scripts-to-bottom=true
# Las fechas se muestran en la zona horaria del servidor (por defecto JSF usa UTC y las corre un día)
joinfaces.jsf.datetimeconverter-default-timezone-is-system-timezone=true
